<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>マインスイーパ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #2b2f36;
    color: #e8eaf0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px 32px;
    user-select: none;
  }
  h1 { font-size: 22px; letter-spacing: .08em; margin-bottom: 14px; font-weight: 700; }
  .panel {
    background: #3a3f47;
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
    max-width: 100%;
  }
  .hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .counter {
    background: #111;
    color: #ff3b30;
    font-family: "Courier New", monospace;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 2px 8px;
    border-radius: 6px;
    min-width: 76px;
    text-align: center;
    border: inset 2px #222;
  }
  #face {
    font-size: 28px;
    width: 52px; height: 52px;
    border: none; border-radius: 10px;
    background: #c0c4cc;
    cursor: pointer;
    box-shadow: 0 3px 0 #7d828c;
    line-height: 1;
  }
  #face:active { transform: translateY(2px); box-shadow: 0 1px 0 #7d828c; }
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 12px;
  }
  .controls button, .mode button {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: #565d68;
    color: #e8eaf0;
  }
  .controls button.active { background: #4f8ff7; color: #fff; }
  .mode { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
  .mode button.active { background: #f7b731; color: #222; }
  #board-wrap { overflow-x: auto; max-width: 92vw; }
  #board {
    display: grid;
    gap: 2px;
    background: #7d828c;
    padding: 6px;
    border-radius: 8px;
    width: max-content;
    margin: 0 auto;
  }
  .cell {
    width: 32px; height: 32px;
    border: none;
    font-size: 17px;
    font-weight: 800;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    border-radius: 3px;
    background: #c0c4cc;
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.18), inset 2px 2px 0 rgba(255,255,255,.55);
    color: #222;
    padding: 0;
  }
  .cell.open {
    background: #dcdfe5;
    box-shadow: inset 1px 1px 0 rgba(0,0,0,.12);
    cursor: default;
  }
  .cell.mine-hit { background: #ff3b30; }
  .cell.flag-wrong { background: #ffb3ae; }
  .n1{color:#2456d6}.n2{color:#1e7d32}.n3{color:#d32f2f}.n4{color:#3b2f8f}
  .n5{color:#8d2f2f}.n6{color:#007b8a}.n7{color:#222}.n8{color:#666}
  .msg { text-align: center; min-height: 22px; font-size: 14px; margin-top: 10px; color: #cfd4dd; }
  .help { margin-top: 14px; font-size: 12.5px; line-height: 1.7; color: #9aa1ad; text-align: center; max-width: 520px; }
  @media (max-width: 560px) { .cell { width: 28px; height: 28px; font-size: 15px; } }
</style>
</head>
<body>
<h1>💣 マインスイーパ</h1>

<div class="panel">
  <div class="controls" id="diff">
    <button data-d="beginner" class="active">初級 9×9 / 10</button>
    <button data-d="intermediate">中級 16×16 / 40</button>
    <button data-d="expert">上級 30×16 / 99</button>
  </div>

  <div class="hud">
    <div class="counter" id="mineCount">010</div>
    <button id="face" title="リスタート">🙂</button>
    <div class="counter" id="timer">000</div>
  </div>

  <div class="mode">
    <button id="modeDig" class="active">⛏️ 開く</button>
    <button id="modeFlag">🚩 旗モード（タッチ用）</button>
  </div>

  <div id="board-wrap"><div id="board"></div></div>
  <div class="msg" id="msg">マスをクリックしてスタート</div>
</div>

<p class="help">
  左クリック：開く ／ 右クリック：旗 🚩<br>
  開いた数字をクリック：周りの旗の数が数字と一致すれば一括で開く（コード）<br>
  初回クリックは、そのマスと周囲8マスに地雷が来ないよう保証されます。
</p>

<script>
"use strict";
const DIFFS = {
  beginner:     { cols: 9,  rows: 9,  mines: 10 },
  intermediate: { cols: 16, rows: 16, mines: 40 },
  expert:       { cols: 30, rows: 16, mines: 99 }
};
let cfg = DIFFS.beginner;
let board = [], started = false, over = false, won = false;
let flags = 0, opened = 0, seconds = 0, timerId = null, flagMode = false;

const boardEl = document.getElementById('board');
const mineEl = document.getElementById('mineCount');
const timerEl = document.getElementById('timer');
const faceEl = document.getElementById('face');
const msgEl = document.getElementById('msg');

const pad = n => String(Math.max(-99, Math.min(999, n))).padStart(3, '0').replace('-', '-').padStart(3,'0');
function fmt(n){ return n < 0 ? '-' + String(Math.min(99, -n)).padStart(2,'0') : String(Math.min(999,n)).padStart(3,'0'); }
function updateCounters(){ mineEl.textContent = fmt(cfg.mines - flags); timerEl.textContent = fmt(seconds); }

function neighbors(x, y){
  const out = [];
  for(let dy=-1; dy<=1; dy++) for(let dx=-1; dx<=1; dx++){
    if(!dx && !dy) continue;
    const nx=x+dx, ny=y+dy;
    if(nx>=0 && nx<cfg.cols && ny>=0 && ny<cfg.rows) out.push(board[ny][nx]);
  }
  return out;
}

function newGame(){
  clearInterval(timerId); timerId = null;
  started = false; over = false; won = false;
  flags = 0; opened = 0; seconds = 0;
  faceEl.textContent = '🙂';
  msgEl.textContent = 'マスをクリックしてスタート';
  board = [];
  for(let y=0; y<cfg.rows; y++){
    const row = [];
    for(let x=0; x<cfg.cols; x++) row.push({x, y, mine:false, open:false, flag:false, n:0});
    board.push(row);
  }
  boardEl.style.gridTemplateColumns = `repeat(${cfg.cols}, auto)`;
  boardEl.innerHTML = '';
  for(let y=0; y<cfg.rows; y++) for(let x=0; x<cfg.cols; x++){
    const c = board[y][x];
    const btn = document.createElement('button');
    btn.className = 'cell'; btn.dataset.x = x; btn.dataset.y = y;
    btn.addEventListener('click', () => onClick(c));
    btn.addEventListener('contextmenu', e => { e.preventDefault(); onFlag(c); });
    let pressTimer = null;
    btn.addEventListener('touchstart', () => { pressTimer = setTimeout(() => { onFlag(c); pressTimer = null; }, 450); }, {passive:true});
    btn.addEventListener('touchend', () => { if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } });
    c.el = btn;
    boardEl.appendChild(btn);
  }
  updateCounters();
}

function placeMines(safe){
  const banned = new Set([safe, ...neighbors(safe.x, safe.y)].map(c => c.y * cfg.cols + c.x));
  let placed = 0;
  while(placed < cfg.mines){
    const i = Math.floor(Math.random() * cfg.cols * cfg.rows);
    if(banned.has(i)) continue;
    const c = board[Math.floor(i / cfg.cols)][i % cfg.cols];
    if(c.mine) continue;
    c.mine = true; placed++;
  }
  for(let y=0; y<cfg.rows; y++) for(let x=0; x<cfg.cols; x++){
    const c = board[y][x];
    c.n = neighbors(x, y).filter(n => n.mine).length;
  }
}

function startTimer(){
  timerId = setInterval(() => { seconds = Math.min(999, seconds + 1); updateCounters(); }, 1000);
}

function render(c){
  if(c.open){
    c.el.classList.add('open');
    c.el.textContent = c.mine ? '💣' : (c.n ? c.n : '');
    if(c.n) c.el.classList.add('n' + c.n);
  } else {
    c.el.textContent = c.flag ? '🚩' : '';
  }
}

function openCell(c){
  if(c.open || c.flag || over) return;
  c.open = true; opened++;
  render(c);
  if(c.n === 0 && !c.mine){
    for(const n of neighbors(c.x, c.y)) if(!n.open) openCell(n);
  }
}

function checkWin(){
  if(opened === cfg.cols * cfg.rows - cfg.mines){
    won = true; over = true;
    clearInterval(timerId);
    faceEl.textContent = '😎';
    msgEl.textContent = `クリア！ ${seconds}秒で全ての地雷を回避しました`;
    for(let y=0; y<cfg.rows; y++) for(let x=0; x<cfg.cols; x++){
      const c = board[y][x];
      if(c.mine && !c.flag){ c.flag = true; flags++; render(c); }
    }
    updateCounters();
  }
}

function gameOver(hit){
  over = true;
  clearInterval(timerId);
  faceEl.textContent = '😵';
  msgEl.textContent = 'ゲームオーバー… 顔をクリックでもう一度';
  hit.el.classList.add('mine-hit');
  for(let y=0; y<cfg.rows; y++) for(let x=0; x<cfg.cols; x++){
    const c = board[y][x];
    if(c.mine && !c.flag){ c.open = true; render(c); }
    else if(!c.mine && c.flag){ c.el.classList.add('flag-wrong'); c.el.textContent = '❌'; }
  }
  hit.el.textContent = '💣';
}

function chord(c){
  if(!c.open || !c.n) return;
  const ns = neighbors(c.x, c.y);
  if(ns.filter(n => n.flag).length !== c.n) return;
  for(const n of ns){
    if(n.flag || n.open) continue;
    if(n.mine){ openCell(n); gameOver(n); return; }
    openCell(n);
  }
  checkWin();
}

function onClick(c){
  if(over) return;
  if(flagMode){ onFlag(c); return; }
  if(c.open){ chord(c); return; }
  if(c.flag) return;
  if(!started){
    started = true;
    placeMines(c);
    startTimer();
  }
  if(c.mine){ c.open = true; render(c); gameOver(c); return; }
  openCell(c);
  checkWin();
}

function onFlag(c){
  if(over || c.open) return;
  if(!started){ /* 開始前でも旗は置ける */ }
  c.flag = !c.flag;
  flags += c.flag ? 1 : -1;
  render(c);
  updateCounters();
}

faceEl.addEventListener('click', newGame);
document.getElementById('diff').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#diff button').forEach(x => x.classList.toggle('active', x === b));
  cfg = DIFFS[b.dataset.d];
  newGame();
});
const digBtn = document.getElementById('modeDig'), flagBtn = document.getElementById('modeFlag');
function setMode(f){
  flagMode = f;
  digBtn.classList.toggle('active', !f);
  flagBtn.classList.toggle('active', f);
}
digBtn.addEventListener('click', () => setMode(false));
flagBtn.addEventListener('click', () => setMode(true));
boardEl.addEventListener('contextmenu', e => e.preventDefault());

newGame();
</script>
</body>
</html>
