
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マインスイーパ</title>
<style>
* { box-sizing: border-box; }

body {
  font-family: system-ui, sans-serif;
  background: #f3f5f7;
  color: #263445;
  display: flex;
  justify-content: center;
  padding: 30px 12px;
  margin: 0;
}

.game {
  width: 100%;
  max-width: 620px;
  text-align: center;
}

h1 { margin: 0 0 20px; }

.controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

button {
  cursor: pointer;
  font: inherit;
}

.action {
  border: 1px solid #ccd3dc;
  border-radius: 8px;
  padding: 9px 15px;
  background: white;
}

.action.active {
  background: #2563eb;
  color: white;
  border-color: #2563eb;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 15px;
}

.stat {
  background: white;
  border-radius: 10px;
  padding: 12px;
  box-shadow: 0 1px 4px #0001;
}

.stat small {
  display: block;
  color: #64748b;
}

.stat strong {
  font-family: monospace;
  font-size: 25px;
}

.message {
  background: white;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 15px;
  font-weight: bold;
}

.board-wrapper {
  background: white;
  padding: 10px;
  border-radius: 12px;
  overflow-x: auto;
}

.board {
  display: grid;
  gap: 2px;
  margin: auto;
  width: fit-content;
}

.cell {
  width: 100%;
  aspect-ratio: 1;
  min-width: 0;
  border: 1px solid #91a4b4;
  border-right-color: #e6edf2;
  border-bottom-color: #e6edf2;
  border-radius: 3px;
  background: #aebdca;
  font-weight: 900;
  font-size: clamp(11px, 3vw, 18px);
  padding: 0;
  color: #243447;
  user-select: none;
}

.cell:hover:not(.opened) {
  background: #91a6b8;
}

.cell.opened {
  background: #e6ebef;
  border: 1px solid #cbd4dc;
  cursor: default;
}

.cell.mine {
  background: #f3a3a3;
}

.cell.flagged { color: #dc3545; }

.n1 { color: #2563eb; }
.n2 { color: #16803d; }
.n3 { color: #dc2626; }
.n4 { color: #4338ca; }
.n5 { color: #9f1239; }
.n6 { color: #0891b2; }
.n7 { color: #222; }
.n8 { color: #64748b; }

.help {
  margin-top: 15px;
  font-size: 13px;
  color: #64748b;
}

@media (max-width: 500px) {
  body { padding: 15px 5px; }
  .board-wrapper { padding: 5px; }
}
</style>
</head>
<body>

<div class="game">
  <h1>💣 マインスイーパ</h1>

  <div class="controls">
    <button class="action active" data-level="easy">初級</button>
    <button class="action" data-level="normal">中級</button>
    <button class="action" data-level="hard">上級</button>
    <button class="action" id="new-game">↻ 新しいゲーム</button>
  </div>

  <div class="stats">
    <div class="stat">
      <small>💣 残り地雷</small>
      <strong id="mines">010</strong>
    </div>
    <div class="stat">
      <small>⏱ タイム</small>
      <strong id="timer">000</strong>
    </div>
    <div class="stat">
      <small>🏁 進捗</small>
      <strong id="progress">0%</strong>
    </div>
  </div>

  <div class="message" id="message">
    マスをクリックしてスタート！
  </div>

  <div class="controls">
    <button class="action" id="flag-mode">
      🚩 旗モード OFF
    </button>
  </div>

  <div class="board-wrapper">
    <div class="board" id="board"></div>
  </div>

  <div class="help">
    左クリック：マスを開く<br>
    右クリック：旗を立てる<br>
    数字：周囲8マスにある地雷の数
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const levels = {
    easy:   { w: 9,  h: 9,  m: 10 },
    normal: { w: 16, h: 16, m: 40 },
    hard:   { w: 24, h: 16, m: 99 }
  };

  let level = "easy";
  let w, h, total;
  let cells = [];
  let started = false;
  let ended = false;
  let flags = 0;
  let opened = 0;
  let seconds = 0;
  let tick = null;
  let flagMode = false;

  // 周囲8マスのインデックスを取得
  function around(i) {
    const x = i % w;
    const y = Math.floor(i / w);
    const result = [];

    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (dx === 0 && dy === 0) continue;

        const nx = x + dx;
        const ny = y + dy;

        if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
          result.push(ny * w + nx);
        }
      }
    }

    return result;
  }

  // 画面更新
  function update() {
    $("mines").textContent =
      String(total - flags).padStart(3, "0");

    $("timer").textContent =
      String(seconds).padStart(3, "0");

    $("progress").textContent =
      Math.floor(opened / (w * h - total) * 100) + "%";
  }

  // タイマー
  function stopTimer() {
    if (tick) {
      clearInterval(tick);
      tick = null;
    }
  }

  function startTimer() {
    if (tick) return;

    tick = setInterval(() => {
      seconds++;

      $("timer").textContent =
        String(seconds).padStart(3, "0");

      if (seconds >= 999) stopTimer();
    }, 1000);
  }

  // メッセージ表示
  function message(text) {
    $("message").textContent = text;
  }

  // ゲーム初期化
  function build() {
    stopTimer();

    w = levels[level].w;
    h = levels[level].h;
    total = levels[level].m;

    cells = Array.from(
      { length: w * h },
      () => ({
        mine: false,
        open: false,
        flag: false,
        n: 0
      })
    );

    started = false;
    ended = false;
    flags = 0;
    opened = 0;
    seconds = 0;
    flagMode = false;

    $("flag-mode").textContent = "🚩 旗モード OFF";
    $("flag-mode").classList.remove("active");

    const board = $("board");

    board.style.gridTemplateColumns =
      `repeat(${w}, minmax(0, 1fr))`;

    board.style.maxWidth = w > 16 ? "760px" : "560px";

    board.innerHTML = "";

    cells.forEach((cell, i) => {
      const button = document.createElement("button");

      button.className = "cell";
      button.type = "button";

      button.addEventListener("click", () => {
        if (flagMode) {
          toggleFlag(i);
        } else {
          reveal(i);
        }
      });

      button.addEventListener("contextmenu", e => {
        e.preventDefault();
        toggleFlag(i);
      });

      board.appendChild(button);
    });

    document.querySelectorAll("[data-level]").forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.level === level
      );
    });

    update();
    message("マスをクリックしてスタート！ 最初のクリックは安全です。");
  }

  // 地雷配置（初回クリック周辺は安全）
  function placeMines(first) {
    const safe = new Set([first, ...around(first)]);

    const available = cells
      .map((cell, i) => i)
      .filter(i => !safe.has(i));

    // Fisher-Yatesシャッフル
    for (let j = available.length - 1; j > 0; j--) {
      const k = Math.floor(Math.random() * (j + 1));
      [available[j], available[k]] =
        [available[k], available[j]];
    }

    available.slice(0, total).forEach(i => {
      cells[i].mine = true;
    });

    // 周囲の地雷数を計算
    cells.forEach((cell, i) => {
      cell.n = cell.mine
        ? 0
        : around(i).filter(j => cells[j].mine).length;
    });
  }

  // セル描画
  function draw(i) {
    const cell = cells[i];
    const button = $("board").children[i];

    button.className = "cell";
    button.textContent = "";

    if (cell.open) {
      button.classList.add("opened");

      if (cell.mine) {
        button.classList.add("mine");
        button.textContent = "💣";
      } else if (cell.n > 0) {
        button.textContent = cell.n;
        button.classList.add("n" + cell.n);
      }
    } else if (cell.flag) {
      button.classList.add("flagged");
      button.textContent = "🚩";
    }
  }

  // 旗の切り替え
  function toggleFlag(i) {
    if (ended || cells[i].open) return;

    const cell = cells[i];

    if (!cell.flag && flags >= total) return;

    cell.flag = !cell.flag;
    flags += cell.flag ? 1 : -1;

    draw(i);
    update();
  }

  // マスを開く
  function reveal(i) {
    if (ended || cells[i].open || cells[i].flag) return;

    // 初回クリック時に地雷を配置
    if (!started) {
      started = true;
      placeMines(i);
      startTimer();
    }

    const cell = cells[i];

    cell.open = true;
    opened++;

    draw(i);

    // 地雷を踏んだ場合
    if (cell.mine) {
      lose();
      return;
    }

    // 周囲に地雷がない場合は自動展開
    if (cell.n === 0) {
      for (const j of around(i)) {
        if (!cells[j].open && !cells[j].flag) {
          revealSafe(j);
        }
      }
    }

    update();
    checkWin();
  }

  // 安全なマスの再帰展開
  function revealSafe(i) {
    const cell = cells[i];

    if (cell.open || cell.flag || cell.mine) return;

    cell.open = true;
    opened++;

    draw(i);

    if (cell.n === 0) {
      for (const j of around(i)) {
        revealSafe(j);
      }
    }
  }

  // ゲームオーバー
  function lose() {
    ended = true;
    stopTimer();

    cells.forEach((cell, i) => {
      if (cell.mine) {
        cell.open = true;
        draw(i);
      } else if (cell.flag) {
        const button = $("board").children[i];
        button.textContent = "✕";
        button.className = "cell opened";
        button.style.color = "#dc2626";
      }
    });

    message("💥 ゲームオーバー！ 新しいゲームで再挑戦しよう。");
  }

  // クリア判定
  function checkWin() {
    if (opened === w * h - total) {
      ended = true;
      stopTimer();

      message(
        `🎉 CLEAR！ おめでとう！ ${seconds}秒でクリア！`
      );
    }
  }

  // 難易度切り替え
  document.querySelectorAll("[data-level]").forEach(button => {
    button.addEventListener("click", () => {
      level = button.dataset.level;
      build();
    });
  });

  // 新しいゲーム
  $("new-game").addEventListener("click", build);

  // 旗モード
  $("flag-mode").addEventListener("click", () => {
    flagMode = !flagMode;

    $("flag-mode").textContent =
      "🚩 旗モード " + (flagMode ? "ON" : "OFF");

    $("flag-mode").classList.toggle("active", flagMode);
  });

  // 初期起動
  build();

})();
</script>

</body>
</html>
