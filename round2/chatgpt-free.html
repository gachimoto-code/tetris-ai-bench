<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テトリス</title>
<style>
  :root { color-scheme: dark; --bg:#0b1020; --panel:#151d32; --line:#2b3857; --text:#eef3ff; --muted:#9eacc8; --accent:#73a7ff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:radial-gradient(circle at 50% 0%,#1b2b4c 0,#0b1020 55%); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .app { width:min(760px,100%); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  h1 { margin:0; font-size:clamp(24px,5vw,34px); letter-spacing:.08em; }
  .sub { color:var(--muted); font-size:12px; }
  .game { display:grid; grid-template-columns:minmax(0,1fr) 190px; gap:16px; align-items:start; }
  .board-wrap { position:relative; padding:10px; border:1px solid var(--line); border-radius:16px; background:#080d19; box-shadow:0 18px 50px #0006; }
  canvas { display:block; width:100%; height:auto; border-radius:8px; }
  #board { background:#0b1222; }
  aside { display:grid; gap:12px; }
  .panel { padding:14px; border:1px solid var(--line); border-radius:14px; background:linear-gradient(160deg,#19243b,#111a2c); }
  .label { color:var(--muted); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
  .value { margin-top:4px; font-size:25px; font-weight:750; font-variant-numeric:tabular-nums; }
  #next { width:100%; max-width:150px; margin:8px auto 0; background:#0b1222; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { border:1px solid #47618d; background:#23395f; color:white; border-radius:10px; padding:11px 13px; font:inherit; font-weight:650; cursor:pointer; transition:.15s; }
  button:hover { background:#2e4b7b; transform:translateY(-1px); }
  button:active { transform:translateY(0); }
  button.primary { background:#3977d8; border-color:#5793f0; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .help { color:var(--muted); font-size:12px; line-height:1.8; }
  kbd { display:inline-block; min-width:22px; padding:1px 5px; text-align:center; border:1px solid #42516e; border-radius:5px; background:#0c1425; color:#e7efff; font:11px ui-monospace,monospace; }
  .overlay { position:absolute; inset:10px; display:none; place-items:center; border-radius:9px; background:#07101ddd; text-align:center; padding:20px; }
  .overlay.show { display:grid; }
  .overlay strong { display:block; font-size:28px; margin-bottom:6px; }
  .overlay span { color:var(--muted); font-size:13px; }
  .mobile-controls { display:none; margin-top:12px; grid-template-columns:repeat(4,1fr); gap:8px; }
  .mobile-controls button { padding:13px 4px; touch-action:manipulation; }
  @media (max-width:600px) {
    body { padding:12px; }
    .game { grid-template-columns:minmax(0,1fr) 112px; gap:9px; }
    .board-wrap { padding:6px; }
    aside { gap:8px; }
    .panel { padding:9px; }
    .value { font-size:19px; }
    #next { max-width:90px; }
    .actions { grid-template-columns:1fr; }
    .help { font-size:10px; }
    .mobile-controls { display:grid; }
  }
</style>
</head>
<body>
<main class="app">
  <header><div><h1>TETRIS</h1><div class="sub">シンプルなクラシック・テトリス</div></div><div class="sub">10 × 20 FIELD</div></header>
  <section class="game">
    <div>
      <div class="board-wrap">
        <canvas id="board" width="300" height="600" aria-label="テトリスのプレイフィールド"></canvas>
        <div class="overlay show" id="overlay"><div><strong id="overlayTitle">TETRIS</strong><span id="overlayText">スタートを押してゲーム開始</span></div></div>
      </div>
      <div class="mobile-controls">
        <button data-action="left">◀</button><button data-action="rotate">↻ 回転</button><button data-action="right">▶</button><button data-action="down">▼</button>
        <button data-action="drop" style="grid-column:span 2">ハードドロップ</button><button data-action="pause" style="grid-column:span 2">一時停止</button>
      </div>
    </div>
    <aside>
      <div class="panel"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stats">
        <div class="panel"><div class="label">Level</div><div class="value" id="level">1</div></div>
        <div class="panel"><div class="label">Lines</div><div class="value" id="lines">0</div></div>
      </div>
      <div class="panel"><div class="label">Next</div><canvas id="next" width="120" height="100"></canvas></div>
      <div class="actions"><button class="primary" id="start">スタート</button><button id="pause">一時停止</button><button id="restart">リスタート</button></div>
      <div class="panel help">
        <div class="label">Controls</div>
        <div><kbd>←</kbd> <kbd>→</kbd> 移動</div>
        <div><kbd>↓</kbd> ソフトドロップ</div>
        <div><kbd>↑</kbd> / <kbd>X</kbd> 回転</div>
        <div><kbd>Z</kbd> 逆回転</div>
        <div><kbd>Space</kbd> ハードドロップ</div>
        <div><kbd>P</kbd> 一時停止</div>
      </div>
    </aside>
  </section>
</main>
<script>
(() => {
  const COLS=10, ROWS=20, SIZE=30;
  const COLORS={I:'#35d9e8',O:'#ffd34e',T:'#b27aff',S:'#65df87',Z:'#ff6b7a',J:'#6397ff',L:'#ffad5c'};
  const SHAPES={
    I:[[1,1,1,1]],
    O:[[1,1],[1,1]],
    T:[[0,1,0],[1,1,1]],
    S:[[0,1,1],[1,1,0]],
    Z:[[1,1,0],[0,1,1]],
    J:[[1,0,0],[1,1,1]],
    L:[[0,0,1],[1,1,1]]
  };
  const boardCanvas=document.getElementById('board'), ctx=boardCanvas.getContext('2d');
  const nextCanvas=document.getElementById('next'), nctx=nextCanvas.getContext('2d');
  const $=id=>document.getElementById(id);
  let board, current, next, bag=[], score=0, lines=0, level=1, running=false, paused=false, over=false;
  let last=0, dropCounter=0, raf=0;

  function refillBag(){ bag=Object.keys(SHAPES).sort(()=>Math.random()-.5); }
  function takePiece(){ if(!bag.length) refillBag(); const type=bag.pop(); return {type,matrix:SHAPES[type].map(r=>r.slice()),x:Math.floor((COLS-SHAPES[type][0].length)/2),y:0}; }
  function reset(){
    board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
    score=0; lines=0; level=1; bag=[]; next=takePiece(); current=takePiece();
    running=false; paused=false; over=false; dropCounter=0; updateStats(); draw();
    showOverlay('TETRIS','スタートを押してゲーム開始');
    $('pause').textContent='一時停止';
  }
  function showOverlay(title,msg){ $('overlayTitle').textContent=title; $('overlayText').textContent=msg; $('overlay').classList.add('show'); }
  function hideOverlay(){ $('overlay').classList.remove('show'); }
  function updateStats(){ $('score').textContent=score.toLocaleString('ja-JP'); $('level').textContent=level; $('lines').textContent=lines; }
  function collide(piece,dx=0,dy=0,matrix=piece.matrix){
    for(let y=0;y<matrix.length;y++) for(let x=0;x<matrix[y].length;x++) if(matrix[y][x]){
      const nx=piece.x+x+dx, ny=piece.y+y+dy;
      if(nx<0||nx>=COLS||ny>=ROWS) return true;
      if(ny>=0&&board[ny][nx]) return true;
    }
    return false;
  }
  function merge(){
    current.matrix.forEach((row,y)=>row.forEach((v,x)=>{ if(v){ const by=current.y+y; if(by<0){ endGame(); return; } board[by][current.x+x]=COLORS[current.type]; }}));
    if(over) return;
    let cleared=0;
    for(let y=ROWS-1;y>=0;y--) if(board[y].every(Boolean)){ board.splice(y,1); board.unshift(Array(COLS).fill(null)); cleared++; y++; }
    if(cleared){ const points=[0,100,300,500,800]; score+=points[cleared]*level; lines+=cleared; level=Math.floor(lines/10)+1; updateStats(); }
    current=next; next=takePiece();
    if(collide(current)){ endGame(); }
  }
  function endGame(){ over=true; running=false; showOverlay('GAME OVER','リスタートしてもう一度プレイ'); }
  function move(dx,dy){ if(!running||paused||over) return false; if(!collide(current,dx,dy)){ current.x+=dx; current.y+=dy; return true; } if(dy===1){ merge(); } return false; }
  function rotate(dir=1){
    if(!running||paused||over) return;
    const m=current.matrix, rotated=dir===1?m[0].map((_,i)=>m.map(row=>row[i]).reverse()):m[0].map((_,i)=>m.map(row=>row[row.length-1-i]));
    for(const kick of [0,-1,1,-2,2]) if(!collide(current,kick,0,rotated)){ current.x+=kick; current.matrix=rotated; break; }
  }
  function hardDrop(){ if(!running||paused||over)return; let d=0; while(!collide(current,0,1)){current.y++;d++;} score+=d*2; updateStats(); merge(); }
  function tick(time=0){
    const delta=time-last; last=time;
    if(running&&!paused&&!over){ dropCounter+=delta; if(dropCounter>Math.max(90,800-(level-1)*65)){ move(0,1); dropCounter=0; } draw(); }
    raf=requestAnimationFrame(tick);
  }
  function drawCell(context,x,y,color,size,ghost=false){
    if(!color)return;
    context.globalAlpha=ghost?.28:1;
    context.fillStyle=color; context.fillRect(x*size+1,y*size+1,size-2,size-2);
    context.fillStyle='#ffffff30'; context.fillRect(x*size+3,y*size+3,size-6,Math.max(2,size*.12));
    context.strokeStyle='#ffffff35'; context.lineWidth=1; context.strokeRect(x*size+1.5,y*size+1.5,size-3,size-3);
    context.globalAlpha=1;
  }
  function draw(){
    ctx.clearRect(0,0,300,600);
    ctx.strokeStyle='#ffffff0b'; ctx.lineWidth=1;
    for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*SIZE,0);ctx.lineTo(x*SIZE,600);ctx.stroke();}
    for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*SIZE);ctx.lineTo(300,y*SIZE);ctx.stroke();}
    board.forEach((row,y)=>row.forEach((color,x)=>drawCell(ctx,x,y,color,SIZE)));
    if(current){
      let ghostY=current.y; while(!collide({...current,y:ghostY},0,1))ghostY++;
      current.matrix.forEach((row,y)=>row.forEach((v,x)=>{if(v){drawCell(ctx,current.x+x,ghostY+y,COLORS[current.type],SIZE,true);drawCell(ctx,current.x+x,current.y+y,COLORS[current.type],SIZE);}}));
    }
    nctx.clearRect(0,0,120,100);
    if(next){ const m=next.matrix, cell=22, ox=(120-m[0].length*cell)/2, oy=(100-m.length*cell)/2;
      m.forEach((r,y)=>r.forEach((v,x)=>{if(v){nctx.fillStyle=COLORS[next.type];nctx.fillRect(ox+x*cell+1,oy+y*cell+1,cell-2,cell-2);nctx.fillStyle='#ffffff35';nctx.fillRect(ox+x*cell+3,oy+y*cell+3,cell-6,3);}}));
    }
  }
  function start(){ if(over)reset(); running=true; paused=false; hideOverlay(); $('pause').textContent='一時停止'; last=performance.now(); }
  function togglePause(){ if(over)return; if(!running){start();return;} paused=!paused; $('pause').textContent=paused?'再開':'一時停止'; if(paused)showOverlay('PAUSED','Pキーまたは「再開」で続行'); else hideOverlay(); }
  document.addEventListener('keydown',e=>{
    const keys=['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' ','x','X','z','Z','p','P'];
    if(keys.includes(e.key))e.preventDefault();
    if(e.key==='Enter'&&!running){start();return;}
    if(e.key==='p'||e.key==='P'){togglePause();return;}
    if(!running||paused||over)return;
    if(e.key==='ArrowLeft')move(-1,0);
    else if(e.key==='ArrowRight')move(1,0);
    else if(e.key==='ArrowDown'){if(move(0,1)){score++;updateStats();}dropCounter=0;}
    else if(e.key==='ArrowUp'||e.key==='x'||e.key==='X')rotate(1);
    else if(e.key==='z'||e.key==='Z')rotate(-1);
    else if(e.key===' ')hardDrop();
    draw();
  });
  $('start').addEventListener('click',start);
  $('pause').addEventListener('click',togglePause);
  $('restart').addEventListener('click',()=>{reset();start();});
  document.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>{
    const a=btn.dataset.action;
    if(a==='pause')togglePause();
    else if(a==='left')move(-1,0);
    else if(a==='right')move(1,0);
    else if(a==='down')move(0,1);
    else if(a==='rotate')rotate(1);
    else if(a==='drop')hardDrop();
    draw();
  }));
  reset(); cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);
})();
</script>
</body>
</html>
